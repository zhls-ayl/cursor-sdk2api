services:
  gateway:
    build: .
    restart: unless-stopped
    # Must exceed RUN_DEADLINE_MS plus the final 10-second socket close window.
    stop_grace_period: ${GATEWAY_STOP_GRACE_PERIOD:-61m}
    ports:
      - "${GATEWAY_BIND:-0.0.0.0}:${GATEWAY_PORT:-8080}:8080"
    environment:
      AUTH_MODE: ${AUTH_MODE:-managed}
      GATEWAY_ACCESS_KEY: ${GATEWAY_ACCESS_KEY:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      HOST: 0.0.0.0
      PORT: 8080
      STATE_DIR: /data
      RUN_DEADLINE_MS: ${RUN_DEADLINE_MS:-3600000}
      GLOBAL_ACTIVE_RUNS: ${GLOBAL_ACTIVE_RUNS:-4}
      PER_CREDENTIAL_ACTIVE_RUNS: ${PER_CREDENTIAL_ACTIVE_RUNS:-2}
      MAX_AWAITING_SESSIONS: ${MAX_AWAITING_SESSIONS:-32}
      FIRST_EVENT_TIMEOUT_MS: ${FIRST_EVENT_TIMEOUT_MS:-40000}
      TOOL_BATCH_SETTLE_MS: ${TOOL_BATCH_SETTLE_MS:-1500}
      CATALOG_CACHE_MS: ${CATALOG_CACHE_MS:-300000}
      CATALOG_REFRESH_TIMEOUT_MS: ${CATALOG_REFRESH_TIMEOUT_MS:-5000}
      CATALOG_RETRY_MS: ${CATALOG_RETRY_MS:-5000}
      CATALOG_MAX_STALE_MS: ${CATALOG_MAX_STALE_MS:-300000}
      # A host proxy on Docker Desktop is normally reached through
      # host.docker.internal, not 127.0.0.1 inside the container.
      # HTTPS_PROXY: http://host.docker.internal:7890
      # HTTP_PROXY: http://host.docker.internal:7890
      # NO_PROXY: 127.0.0.1,localhost
    volumes:
      - cursor-sdk2api-data:/data
    # Supply keys at run time. Do not put real secrets in this file.

volumes:
  cursor-sdk2api-data:
