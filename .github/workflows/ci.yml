name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node tests/deployment/node-smoke.mjs
      - run: docker build -t cursor-sdk2api:ci .
      - name: Smoke test production image without upstream credentials
        run: bash tests/deployment/container-smoke.sh cursor-sdk2api:ci
