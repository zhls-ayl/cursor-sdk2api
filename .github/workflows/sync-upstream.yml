name: sync-upstream

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.repository != 'Sunnyender-org/cursor-sdk2api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Merge Sunnyender-org/cursor-sdk2api main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Sunnyender-org/cursor-sdk2api.git
          git fetch --no-tags origin main
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "origin/main already contains upstream/main"
            exit 0
          fi
          git checkout -B sync/upstream origin/main
          git merge --no-edit upstream/main
          git push --force-with-lease origin sync/upstream
          if gh pr list --head sync/upstream --base main --json number --jq '.[0].number' | grep -q '[0-9]'; then
            echo "Sync PR already open"
            exit 0
          fi
          gh pr create \
            --base main \
            --head sync/upstream \
            --title "chore: sync upstream Sunnyender-org/cursor-sdk2api" \
            --body "Automated merge of \`Sunnyender-org/cursor-sdk2api\` \`main\` into this independent fork. Review, resolve product conflicts, then merge."
